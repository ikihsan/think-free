[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmarket"
version = "0.1.0"
description = "Federal Marketplace Assessment Toolkit for small software teams"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dynamic = ["scripts"]
authors = [
    {name = "Think Free Research", email = "research@think-free.local"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Office/Business :: Government",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.0"]

[project.entry-points]
console_scripts = {fedmarket = "fedmarket.cli:main", fedmarket-decide = "fedmarket.decide_cli:main"}

[tool.setuptools.packages.find]
where = ["."]
include = ["fedmarket*"]

[tool.setuptools.package-data]
"fedmarket" = ["raw/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false