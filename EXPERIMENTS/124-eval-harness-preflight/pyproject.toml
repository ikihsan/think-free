[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "preflight"
version = "0.1.0"
description = "Three checks on the instrument that produces an evaluation rate: C1 concordance, C2 alternate-form FP, C3 control arm"
requires-python = ">=3.8"
license = {"text": "MIT"}
keywords = ["evaluation", "harness", "concordance", "verifier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
preflight = "preflight.__main__:main"

[project.urls]
Homepage = "https://github.com/think-free/preflight"
Repository = "https://github.com/think-free/think-free"
Documentation = "https://github.com/think-free/think-free/tree/main/EXPERIMENTS/124-eval-harness-preflight"

[dependencies]
# Standard library only - no external dependencies