[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fedmarket"
version = "0.1.0"
description = "Federal Marketplace Assessment Toolkit for small-team software entry"
license = "MIT"
requires-python = ">=3.8"
keywords = "usaspending, PSC, federal, procurement, software, small-team, govtech"
authors = [{name = "Think Free Project", email = "contact@think-free.example"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
fedmarket = "fedmarket.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fedmarket*"]