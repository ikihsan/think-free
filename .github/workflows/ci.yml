name: ci

# Gates for every push and pull request. Standard library only: no install step,
# no lockfile, no secret. See docs/operations/ci.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Every row must finish. With the default `fail-fast: true` one red row
      # cancels the rest, and a cancelled row is not a version the suite has run
      # on — which is exactly what tests/python-versions.json is a record of.
      fail-fast: false
      matrix:
        # One row per CPython minor the floor claim covers. Until this matrix
        # existed the record's own not_exercised clause said why 3.9 to 3.11 had
        # never run: "CI pins a single version". tests/test_ci_matrix.py holds
        # this list and the record to each other, because a row with no recorded
        # scope makes two existing tests red for a reason that is about the
        # record rather than the code (F018).
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image's own Python is not a contract: ubuntu-latest changes
      # (it migrates to Ubuntu 26 in October 2026) and every 60 recorded runs
      # failed at the Tests step without anyone being able to say which. Pin it —
      # to every minor version the floor claim covers, not to one of them.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show toolchain
        run: |
          python3 --version
          git --version

      # A failing test in CI is only actionable if its identity is readable
      # without downloading the run log, which needs repository admin rights.
      # `::error::` lines become check-run annotations, and those are public.
      - name: Tests
        run: |
          set +e
          set +o pipefail
          PYTHONPATH=tools:tests python3 -m unittest discover -s tests -t tests -v 2>&1 | tee /tmp/unittest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            awk '
              /^(FAIL|ERROR): / { grab = 12 }
              grab > 0 { gsub(/%/, "%25"); gsub(/\r/, ""); printf "::error title=Test failed::%s\n", $0; grab-- }
            ' /tmp/unittest.log | head -60
            grep -E '^(Ran|FAILED)' /tmp/unittest.log | tr -d '\r' | while read -r line; do
              echo "::error title=Test summary::${line//%/%25}"
            done
          fi
          exit "$status"

      # The five gates below read files and do not care which interpreter runs
      # them, so they run on one row rather than seven. The row is 3.12 because
      # that is the entry the record has always carried as CI's; changing it
      # would silently move the version every claim about "CI is green" refers
      # to. tests/test_ci_matrix.py holds the guard to a row that exists, so a
      # typo here stops the gates running at all instead of looking green.

      # `annotate` runs the gate and re-emits each violation as a `::error`
      # line, so a red run names the file it rejected. Before T-0040 these four
      # steps printed a report and exited: the check run's only annotation was
      # "Process completed with exit code 2", and the run log that says which
      # rule failed needs repository admin rights. The wrapper is the tooling
      # rather than shell in this file, so it is covered by the suite and can
      # be run by a VM to reproduce a run it cannot read.
      - name: Documentation lint
        if: matrix.python-version == '3.12'
        run: tools/origin annotate -- doc lint

      # RELEASE-MANIFEST.md decides what is public. Kept next to the doc lint
      # step rather than appended at the end, so a VM editing the session gate
      # below and this one in the same week rebase cleanly.
      - name: Release manifest
        if: matrix.python-version == '3.12'
        run: tools/origin annotate -- release check

      - name: Skill layout and mirrors
        if: matrix.python-version == '3.12'
        run: tools/origin annotate -- skills check

      - name: Vendored content integrity
        if: matrix.python-version == '3.12'
        run: tools/origin annotate -- skills verify

      # Strict: no session runs in this checkout, so an unfinished session is a
      # real failure unless its task claim proves it is still being worked on
      # elsewhere. In-flight sessions are warnings, not errors (D024), re-emitted
      # as annotations for the same reason failing tests are: nobody without
      # admin rights can read the run log.
      # An in-flight session on another VM is a warning, not an error (D024), so
      # it is still re-emitted from the log rather than through the wrapper.
      - name: Session record integrity
        if: matrix.python-version == '3.12'
        run: |
          set +e
          set +o pipefail
          tools/origin annotate -- session verify --strict 2>&1 | tee /tmp/session-verify.log
          status=${PIPESTATUS[0]}
          grep -E '^  note  .*in flight' /tmp/session-verify.log \
            | sed -e 's|^  note  |::warning title=Session in flight on another VM::|' \
            || true
          exit "$status"