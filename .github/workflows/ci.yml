name: ci

# Gates for every push and pull request. Standard library only: no install step,
# no lockfile, no secret. See docs/operations/ci.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image's own Python is not a contract: ubuntu-latest changes
      # (it migrates to Ubuntu 26 in October 2026) and every 60 recorded runs
      # failed at the Tests step without anyone being able to say which. Pin it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show toolchain
        run: |
          python3 --version
          git --version

      # A failing test in CI is only actionable if its identity is readable
      # without downloading the run log, which needs repository admin rights.
      # `::error::` lines become check-run annotations, and those are public.
      - name: Tests
        run: |
          set +e
          set +o pipefail
          PYTHONPATH=tools:tests python3 -m unittest discover -s tests -t tests -v 2>&1 | tee /tmp/unittest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            awk '
              /^(FAIL|ERROR): / { grab = 12 }
              grab > 0 { gsub(/%/, "%%"); gsub(/\r/, ""); printf "::error title=Test failed::%s\n", $0; grab-- }
            ' /tmp/unittest.log | head -60
            grep -E '^(Ran|FAILED)' /tmp/unittest.log | tr -d '\r' | while read -r line; do
              echo "::error title=Test summary::${line//%/%%}"
            done
          fi
          exit "$status"

      - name: Documentation lint
        run: tools/origin doc lint

      # RELEASE-MANIFEST.md decides what is public. Kept next to the doc lint
      # step rather than appended at the end, so a VM editing the session gate
      # below and this one in the same week rebase cleanly.
      - name: Release manifest
        run: tools/origin release check

      - name: Skill layout and mirrors
        run: tools/origin skills check

      - name: Vendored content integrity
        run: tools/origin skills verify

      # Strict: no session runs in this checkout, so an unfinished session is a
      # real failure unless its task claim proves it is still being worked on
      # elsewhere. In-flight sessions are warnings, not errors (D024), re-emitted
      # as annotations for the same reason failing tests are: nobody without
      # admin rights can read the run log.
      - name: Session record integrity
        run: |
          set +e
          set +o pipefail
          tools/origin session verify --strict 2>&1 | tee /tmp/session-verify.log
          status=${PIPESTATUS[0]}
          grep -E '^  note  .*in flight' /tmp/session-verify.log \
            | sed -e 's|^  note  |::warning title=Session in flight on another VM::|' \
            || true
          exit "$status"